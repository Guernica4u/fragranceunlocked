name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 560fbdaf67f46bb03533860d28304abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        # Skips until the CLOUDFLARE_API_TOKEN repo secret is added.
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir dist && cp index.html data.json dist/
          npx -y wrangler@4.161.0 pages deploy dist --project-name fragranceunlocked --branch main --force

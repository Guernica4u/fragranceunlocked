<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Secrets</title>
<style>
  :root { --fg: #111; --bg: #fff; --mute: #777; --line: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --mute: #888; --line: #2a2a2a; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 640px; padding: 15vh 16px 64px; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  p { color: var(--mute); margin: 0 0 32px; }
  input { width: 100%; padding: 12px 0; font: inherit; font-size: 1.25rem; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--fg); outline: none; }
  article { padding: 24px 0; border-bottom: 1px solid var(--line); }
  h2 { font-size: 1.1rem; margin: 0; }
  small, dt { color: var(--mute); }
  dl { display: grid; grid-template-columns: 72px 1fr; gap: 4px 12px; margin: 16px 0 0; }
  dd { margin: 0; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>No secrets.</h1>
<p>Every price. Every note. Every dupe.</p>
<label for="q" hidden>Search fragrances</label>
<input id="q" type="search" placeholder="Search a fragrance" autocomplete="off" autofocus>
<main id="out"></main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = encodeURIComponent;
let data;

function card(f) {
  const q = `${f.brand} ${f.name}`;
  // shortcut: links out to each store's search instead of live prices; add a price feed to fill f.prices.
  const stores = Object.entries(data.stores)
    .map(([s, url]) => `<a href="${url}${enc(q)}" target="_blank" rel="noopener">${esc(s)}${f.prices[s] ? ' $' + esc(f.prices[s]) : ''}</a>`)
    .join(' · ');
  const list = a => a.map(esc).join(', ') || '—';
  return `<article>
    <h2>${esc(f.name)}</h2><small>${esc(f.brand)}</small>
    <dl>
      <dt>Top</dt><dd>${list(f.notes.top)}</dd>
      <dt>Heart</dt><dd>${list(f.notes.heart)}</dd>
      <dt>Base</dt><dd>${list(f.notes.base)}</dd>
      <dt>Dupes</dt><dd>${list(f.dupes)}</dd>
      <dt>Similar</dt><dd>${list(f.similar)}</dd>
      <dt>Buy</dt><dd>${stores}</dd>
      <dt>More</dt><dd><a href="https://www.fragrantica.com/search/?query=${enc(q)}" target="_blank" rel="noopener">Fragrantica</a></dd>
    </dl>
  </article>`;
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const hits = data.fragrances.filter(f => `${f.brand} ${f.name} ${f.dupes} ${f.similar}`.toLowerCase().includes(q));
  document.getElementById('out').innerHTML = hits.length ? hits.map(card).join('')
    : `<article><small>Not in our list yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" target="_blank" rel="noopener">Search Fragrantica</a></small></article>`;
}

fetch('data.json').then(r => r.json()).then(d => {
  data = d;
  document.getElementById('q').addEventListener('input', render);
  render();
});
</script>
</body>
</html>

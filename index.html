<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragrance Unlocked</title>
<meta name="description" content="Smell expensive. Pay honest. Notes, accords, prices and dupes.">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<nav>
  <div class="bar">
    <a class="logo" href="#explore">Fragrance <b>Unlocked</b></a>
    <div class="tabs">
      <a href="#explore">Explore</a>
      <a href="#dupes">Dupes</a>
      <a href="#match">Match me</a>
    </div>
    <div class="settings">
      <div class="seg" role="group" aria-label="Show fragrances for">
        <button data-g="both">Both</button><button data-g="men">Men</button><button data-g="women">Women</button>
      </div>
      <button class="theme" id="theme" aria-label="Switch light or dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="wrap">
  <section id="explore" class="view" hidden>
    <div class="hero">
      <h1><span style="--i:0">Smell</span> <span style="--i:1">expensive.</span><br><span style="--i:2"><em>Pay</em></span> <span style="--i:3"><em>honest.</em></span></h1>
      <p>Notes. Prices. Dupes. One place.</p>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="find">
      <label for="q" hidden>Search by name, brand or note</label>
      <input id="q" type="search" placeholder="Search name, brand or note" autocomplete="off">
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="marquee" aria-label="Notes"><div id="marquee"></div></div>
    <div id="top"></div>
    <div class="sub"><h2 id="feedTitle">Explore</h2>
      <div class="tools">
        <label class="pick">Sort <select id="sort">
          <option value="shuffle">Shuffle</option><option value="az">Name A–Z</option>
          <option value="rated">Top rated</option><option value="dupes">Most dupes</option><option value="price">Price, low to high</option>
        </select></label>
        <button class="link" id="filterBtn" aria-expanded="false" aria-controls="filters">Filter</button>
        <button class="link" id="shuffle">Shuffle</button>
      </div>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="seg" id="kind" role="group" aria-label="Type">
        <button data-kind="all" aria-pressed="true">All</button><button data-kind="original" aria-pressed="false">Originals</button><button data-kind="dupe" aria-pressed="false">Dupes</button>
      </div>
      <label class="pick">Accord <select id="faccord"><option value="">Any</option></select></label>
      <label class="pick">Brand <select id="fbrand"><option value="">Any</option></select></label>
      <button class="link" id="fclear">Clear</button>
    </div>
    <div class="grid dense" id="feed"></div>
    <div id="sentinel"></div>
    <div class="end" id="end" hidden><p class="none" id="endText"></p><button class="btn" id="again">Shuffle again</button></div>
  </section>

  <section id="dupes" class="view narrow" hidden>
    <div class="head">
      <h2>Dupes</h2>
      <p>Type any fragrance. See what it dupes, or what dupes it.</p>
      <label for="dq" hidden>Search any fragrance</label>
      <input id="dq" type="search" placeholder="9PM, Aventus, Cloud…" autocomplete="off">
      <div class="count" id="dcount" aria-live="polite"></div>
    </div>
    <div id="dout"></div>
    <div id="dsentinel"></div>
    <p class="none end" id="dend" hidden></p>
  </section>

  <section id="match" class="view" hidden>
    <div class="head"><h2>Match me</h2><p>Three questions. Then your picks.</p></div>
    <div id="quiz"></div>
  </section>

  <section id="page" class="view" hidden></section>
</div>

<script type="module">
import { accords as accordsOf, ink } from './accords.js';
import { norm, slug } from './shared.js';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const $ = id => document.getElementById(id);
const ext = 'target="_blank" rel="noopener"';
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let data, ratings = null, gender = store.get('gender') || 'both';

const GENDER = { men: 'For men', women: 'For women', unisex: 'Unisex' };

const notesOf = f => [...f.notes.top, ...f.notes.heart, ...f.notes.base];
const pool = () => data.fragrances.filter(f => gender === 'both' || f.gender === gender || f.gender === 'unisex');
const accCache = new Map();
const acc = f => accCache.get(f) || accCache.set(f, accordsOf(notesOf(f))).get(f);
const dots = f => `<div class="dots">${acc(f).slice(0, 3).map(a => `<span style="--c:${a.color}">${a.name}</span>`).join('')}</div>`;
const full = f => f.name.startsWith(f.brand) ? f.name : `${f.brand} ${f.name}`; // "Dior Homme", not "Dior Dior Homme"
const href = f => `#f/${slug(f)}`;
const find = name => data.fragrances.find(f => slug(f) === norm(name));
// Dupes of a fragrance: entries that say they dupe it, plus names it lists.
const dupesOf = f => data.fragrances.filter(d => d.dupeOf && norm(d.dupeOf) === slug(f));
const originalOf = f => f.dupeOf ? find(f.dupeOf) : null;

const SHAPES = [
  'M16 38a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v64a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8z',
  'M40 36a36 36 0 1 1 0 72a36 36 0 1 1 0-72z',
  'M8 54a14 14 0 0 1 14-14h36a14 14 0 0 1 14 14v42a14 14 0 0 1-14 14H22a14 14 0 0 1-14-14z',
];
let gid = 0;
function art(f, cls = '', style = '') {
  const open = `<div class="art ${cls}" style="${style}">`;
  if (f.image) return `${open}<img src="${esc(f.image)}&width=${cls === 'big' ? 700 : 400}" alt="${esc(full(f))} bottle" loading="lazy"></div>`;
  const c = acc(f).slice(0, 3).map(a => a.color);
  if (!c.length) c.push('#d8d2c8');
  if (c.length < 2) c.push(c[0]);
  const shape = SHAPES[[...f.name].reduce((h, ch) => h + ch.charCodeAt(0), 0) % SHAPES.length];
  const id = 'g' + gid++;
  const stops = c.map((x, j) => `<stop offset="${j / (c.length - 1)}" stop-color="${x}"/>`).join('');
  return `${open}<svg viewBox="0 0 80 112" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".4" y2="1">${stops}</linearGradient></defs>
    <rect x="29" y="2" width="22" height="20" rx="4" fill="#3a3f46"/><rect x="34" y="21" width="12" height="12" fill="#3a3f46" opacity=".8"/>
    <path d="${shape}" fill="url(#${id})"/><path d="${shape}" fill="none" stroke="#000" stroke-opacity=".08"/>
    <rect x="22" y="48" width="5" height="34" rx="2.5" fill="#fff" opacity=".4"/></svg></div>`;
}

const chipQ = list => list.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');
const avg = f => { const r = ratings?.[slug(f)]; return r?.count ? r.sum / r.count : 0; };
function tile(f, i, extra = '') {
  const n = dupesOf(f).length;
  const r = ratings?.[slug(f)];
  return `<a class="tile" href="${href(f)}" style="--i:${i}">
    ${f.dupeOf ? '<span class="pill left">Dupe</span>' : ''}${n ? `<span class="pill">${plural(n, 'dupe')}</span>` : ''}
    ${art(f)}<div class="name">${esc(f.name)}</div><div class="brand">${esc(f.brand)}${r?.count ? ` · ★ ${avg(f).toFixed(1)}` : ''}</div>${extra}${dots(f)}</a>`;
}

/* ---------- Explore (with search) ---------- */
// A list that renders 9 items at a time while its sentinel is near the viewport, until everything is shown.
const pagers = [];
function pager(view, out, sentinel, render, after) {
  const p = { list: [], shown: 0,
    reset(list) { p.list = list; p.shown = 0; $(out).innerHTML = ''; p.more(); requestAnimationFrame(fill); },
    more() {
      const next = p.list.slice(p.shown, p.shown + 24);
      $(out).insertAdjacentHTML('beforeend', next.map(render).join(''));
      p.shown += next.length;
      after(p, next);
    },
    near: () => !$(view).hidden && p.shown < p.list.length && $(sentinel).getBoundingClientRect().top < innerHeight + 400 };
  pagers.push(p);
  return p;
}
const fill = () => pagers.forEach(p => { while (p.near()) p.more(); });
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const has = (q, fields) => fields.join(' ').toLowerCase().includes(q);

// Live "from" price on each tile, once its page is on screen (needs /api/prices; blank without it).
function tilePrices(list) {
  for (const f of list) Promise.resolve(stored(f)).then(ps => {
    const el = document.querySelector(`.tprice[data-p="${slug(f)}"]`);
    if (el && ps.length) el.textContent = `From $${low(f).toFixed(2)}`;
  });
}

// Hand-picked bottles floating in the hero, in order; the gender switch hides those that don't fit.
const SHELF = ['Jean Paul Gaultier Le Male Le Parfum', 'Versace Dylan Blue', 'Maison Francis Kurkdjian Baccarat Rouge 540',
  'Yves Saint Laurent Libre', 'Dior Sauvage', 'Parfums de Marly Delina', 'Creed Aventus', 'Yves Saint Laurent Black Opium'];
// Shuffle keeps designers and niche first, budget houses next, and bottles without a photo last.
const rank = f => !f.image ? 2 : CLONE_HOUSES.has(f.brand) || BUDGET_HOUSES.has(f.brand) ? 1 : 0;
const filt = { kind: 'all', accord: '', brand: '' };
const SORTS = {
  shuffle: l => shuffle(l).sort((a, b) => rank(a) - rank(b)),
  az: l => [...l].sort((a, b) => full(a).localeCompare(full(b))),
  rated: l => [...l].sort((a, b) => avg(b) - avg(a) || (ratings?.[slug(b)]?.count || 0) - (ratings?.[slug(a)]?.count || 0)),
  dupes: l => [...l].sort((a, b) => dupesOf(b).length - dupesOf(a).length),
  price: l => [...l].sort((a, b) => low(a) - low(b) || 0), // unpriced (Infinity) last; Infinity - Infinity is NaN
};
const feedPager = pager('explore', 'feed', 'sentinel', (f, i) => tile(f, i, `<div class="tprice" data-p="${slug(f)}"></div>`), (p, next) => {
  const q = $('q').value.trim();
  $('end').hidden = p.shown < p.list.length || !p.list.length;
  $('endText').textContent = `That's all ${plural(p.list.length, 'fragrance', 'fragrances')}.`;
  $('again').hidden = !!q || $('sort').value !== 'shuffle';
  if (!q) $('count').textContent = p.list.length ? `${p.shown} of ${p.list.length} shown` : '';
  tilePrices(next);
});
function resetFeed() {
  const q = $('q').value.trim().toLowerCase();
  let list = pool().filter(f => (!q || has(q, [f.brand, f.name, ...notesOf(f), ...acc(f).map(a => a.name)]))
    && (filt.kind === 'all' || (filt.kind === 'dupe') === !!f.dupeOf)
    && (!filt.accord || acc(f).slice(0, 3).some(a => a.name === filt.accord))
    && (!filt.brand || f.brand === filt.brand));
  list = SORTS[$('sort').value](list);
  const on = filt.kind !== 'all' || filt.accord || filt.brand;
  $('filterBtn').textContent = on ? 'Filter •' : 'Filter';
  $('count').textContent = q ? plural(list.length, 'match', 'matches') : '';
  $('feedTitle').textContent = q ? `Results for ${$('q').value.trim()}` : 'Explore';
  $('shuffle').hidden = !!q || $('sort').value !== 'shuffle';
  feedPager.reset(list);
  if (!list.length) $('feed').innerHTML = `<p class="none">Nothing yet. ${q ? `<a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a>` : 'Loosen the filters.'}</p>`;
}
function fillFilters() {
  const names = new Set(), brands = new Set();
  for (const f of data.fragrances) { acc(f).slice(0, 3).forEach(a => names.add(a.name)); brands.add(f.brand); }
  const opts = s => [...s].sort((a, b) => a.localeCompare(b)).map(x => `<option>${esc(x)}</option>`).join('');
  $('faccord').insertAdjacentHTML('beforeend', opts(names));
  $('fbrand').insertAdjacentHTML('beforeend', opts(brands));
}
function renderTop() {
  const top = pool().filter(f => ratings?.[slug(f)]?.count)
    .sort((a, b) => avg(b) - avg(a) || ratings[slug(b)].count - ratings[slug(a)].count).slice(0, 3);
  $('top').innerHTML = top.length ? `<div class="sub"><h2>Top rated</h2><small>Voted by visitors</small></div>
    <div class="grid">${top.map((f, i) => tile(f, i)).join('')}</div>` : '';
}
function renderExplore() {
  const picks = SHELF.map(find).filter(f => f && pool().includes(f)).slice(0, 6);
  $('shelf').innerHTML = picks.map((f, i) => `<a href="${href(f)}" aria-label="${esc(full(f))}" style="--i:${i}">${art(f)}</a>`).join('');
  renderTop();
  resetFeed();
}

/* ---------- Dupes: what does it dupe, what dupes it ---------- */
function verdict(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const parts = [];
  if (f.dupeOf) parts.push(`Dupe of ${o ? `<a href="${href(o)}">${esc(full(o))}</a>` : esc(f.dupeOf)}.`);
  if (mine.length) parts.push(`Its dupes:<div class="chips">${mine.map(d => `<a class="chip" href="${href(d)}">${esc(full(d))} →</a>`).join('')}</div>`);
  if (!parts.length) parts.push(CLONE_HOUSES.has(f.brand) ? 'From a clone house, but not linked to an original yet.' : 'Not a dupe. No known dupes yet.');
  return parts.join(' ');
}
// Houses known for dupes; their unlinked scents aren't called "Original".
const CLONE_HOUSES = new Set(['Lattafa', 'Armaf', 'Khadlaj', 'Rasasi', 'Al Haramain', 'Maison Alhambra', 'Afnan', 'French Avenue', 'Rayhaan', 'Zara', 'Dossier', 'Alt. Fragrances', 'Ard Al Zaafaran', 'Mykonos']);
// Budget Middle Eastern houses with their own originals: not clones, but not designer or niche either.
const BUDGET_HOUSES = new Set(['Ajmal', 'Swiss Arabian']);
// Dupe houses we vouch for: well made, not knockoffs. Match me suggests these first.
const QUALITY_HOUSES = new Set(['French Avenue', 'Rayhaan', 'Armaf', 'Afnan', 'Lattafa', 'Al Haramain']);
const label = f => f.dupeOf ? (QUALITY_HOUSES.has(f.brand) ? 'Quality dupe' : 'Dupe') : CLONE_HOUSES.has(f.brand) ? 'Clone house' : 'Original';
const box = f => `<article class="box">
    <a class="top" href="${href(f)}">${art(f, 'thumb')}<div><div class="label">${label(f)}</div><h3>${esc(f.name)}</h3><div class="brand">${esc(f.brand)}</div></div></a>
    <div class="verdict">${verdict(f)}</div></article>`;
const dupePager = pager('dupes', 'dout', 'dsentinel', box, p => {
  $('dend').hidden = p.shown < p.list.length || !p.list.length;
  $('dend').textContent = `That's all ${plural(p.list.length, 'fragrance', 'fragrances')}.`;
});
function renderDupes() {
  const q = $('dq').value.trim().toLowerCase();
  const hits = q ? pool().filter(f => has(q, [f.brand, f.name, full(f)]))
    : [...pool()].sort((a, b) => dupesOf(b).length - dupesOf(a).length || !!b.dupeOf - !!a.dupeOf); // originals with dupes, then dupes, then the rest
  $('dcount').textContent = q ? plural(hits.length, 'match', 'matches') : plural(hits.length, 'fragrance', 'fragrances');
  dupePager.reset(hits);
  if (!hits.length) $('dout').innerHTML = `<p class="none" style="text-align:center;margin-top:32px">Not in our list yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a></p>`;
}

/* ---------- Match me: budget, dupe or original, a vibe. Then: what that smell is called, the classic, and the dupe ---------- */
// [everyday words, hint, accords (first one matters most), family, what it means, the classic that defines it]
const VIBES = [
  ['Fresh-cut grass', 'Leaves, stems, a green snap', ['Green', 'Aromatic', 'Earthy'], 'a green', 'Snapped stems, wet leaves and cut grass. Sharp, natural and outdoorsy.', 'Parfums de Marly Greenley'],
  ['Pure vanilla', 'Soft, warm, sweet', ['Vanilla', 'Sweet', 'Amber'], 'a vanilla', 'Creamy and warm, with a little sweetness. Cozy without smelling like dessert.', 'Parfums de Marly Althair'],
  ['Apple pie & ice cream', 'Warm, sweet, cozy', ['Sweet', 'Vanilla', 'Warm spicy', 'Fruity', 'Nutty'], 'a gourmand', 'Gourmand means it smells good enough to eat: baked fruit, caramel and warm spice.', "Kilian Angels' Share"],
  ['A brand-new leather boot', 'Rich, smoky, grown-up', ['Leather', 'Smoky', 'Woody'], 'a leather', 'Soft hide with a little smoke. Bold, polished and a bit rugged.', 'Tom Ford Ombré Leather'],
  ['A day at the beach', 'Salt air, citrus, sun', ['Aquatic', 'Citrus', 'Fresh', 'Tropical'], 'an aquatic', 'Aquatic means sea air, salt and clean water. Easy to wear when it is hot.', 'Giorgio Armani Acqua di Gio Profondo'],
  ['A forest after rain', 'Woody, earthy, damp', ['Woody', 'Earthy', 'Green', 'Aromatic'], 'a woody', 'Cedar, sandalwood and damp earth. Calm, dry and grounded.', 'Le Labo Santal 33'],
  ['A flower shop', 'Petals everywhere', ['Floral', 'Rose', 'White floral', 'Powdery'], 'a floral', 'Fresh petals front and center, from soft rose to rich jasmine.', 'Parfums de Marly Delina'],
  ['Fresh laundry', 'Clean, soft, skin-like', ['Musky', 'Powdery', 'Fresh', 'Aromatic'], 'a clean musk', 'Musk here means warm, clean skin and soft cotton, like sheets out of the dryer.', 'Narciso Rodriguez For Her'],
  ['A spice market', 'Pepper, saffron, warmth', ['Warm spicy', 'Fresh spicy', 'Amber'], 'a warm spicy', 'Cinnamon, tobacco and saffron. Rich and made for cold weather.', 'Tom Ford Tobacco Vanille'],
  ['A campfire', 'Smoke, resin, embers', ['Smoky', 'Amber', 'Woody', 'Oud'], 'a smoky', 'Burning wood, incense and resin. Moody, warm and hard to miss.', 'Maison Margiela Replica By the Fireplace'],
  ['A coffee shop', 'Espresso and pastry', ['Coffee', 'Sweet', 'Vanilla', 'Nutty'], 'a coffee', 'Dark roast softened with vanilla and sugar. Sweet with a bitter edge.', 'Yves Saint Laurent Black Opium'],
  ['A fruit stand', 'Juicy and bright', ['Fruity', 'Citrus', 'Tropical'], 'a fruity', 'Ripe, juicy fruit up top, from pineapple to blackcurrant. Bright and loud.', 'Creed Aventus'],
];
// Value is "min-max" in dollars; a max of 0 means no ceiling.
const BUDGETS = [['Under $50', 'Dupes and budget gems', '0-50'], ['$50 to $120', 'Designers and the best dupes', '50-120'], ['$120 to $250', 'Most designers', '120-250'], ['$250 and up', 'Niche and luxury', '250-0'], ['No limit', 'Show me everything', '0-0']];
const KINDS = [['A dupe', 'Smells close, costs less', 'dupe'], ['The original', 'The real thing', 'original'], ['Either', 'Show me both', 'any']];
const fresh = () => ({ step: 0, budget: null, kind: null, vibes: [] });
let quiz = fresh();

const opt = (key, label, sub, value, on) =>
  `<button class="opt" data-key="${key}" data-val="${esc(value)}" aria-pressed="${on}">${esc(label)}<small>${esc(sub)}</small></button>`;
function renderQuiz() {
  const { step, budget, kind, vibes } = quiz;
  if (step === 3) return renderPicks();
  const [title, hint, opts] = [
    ['What can you spend?', 'For a full bottle, about 100 ml.', BUDGETS.map(([l, s, v]) => opt('budget', l, s, v, v === budget))],
    ['Dupe or the real thing?', 'Dupes get you close for a lot less.', KINDS.map(([l, s, v]) => opt('kind', l, s, v, v === kind))],
    ['What do you want to smell like?', "Don't know the words for it? Pick what it reminds you of.", VIBES.map(([l, s]) => opt('vibe', l, s, l, vibes.includes(l)))],
  ][step];
  $('quiz').innerHTML = `<div class="qstep">
    <div class="progress">${[0, 1, 2].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
    <div class="label">Question ${step + 1} of 3</div><h3>${title}</h3><p class="hint">${hint}</p>
    <div class="opts">${opts.join('')}</div>
    <div class="qnav">${step ? '<button class="link" data-qback>← Back</button>' : '<span></span>'}
      ${step === 2 ? `<button class="btn" data-qdone ${vibes.length ? '' : 'disabled'}>See my matches</button>` : ''}</div></div>`;
}

const isDupeHouse = f => !!f.dupeOf || CLONE_HOUSES.has(f.brand);
const priceText = f => low(f) < Infinity ? `From $${low(f).toFixed(2)}` : 'See stores for price';
const range = () => (quiz.budget || '0-0').split('-').map(Number);
// A dupe that costs less than the budget's floor still fits: nobody minds paying less for the same smell.
function fits(f) {
  const [min, max] = range();
  return !min && !max ? true : low(f) < Infinity && (isDupeHouse(f) || low(f) >= min) && (!max || low(f) <= max);
}
// The houses people ask for by name come first, then the others we vouch for.
const dupeRank = f => ['French Avenue', 'Rayhaan'].includes(f.brand) ? 2 : QUALITY_HOUSES.has(f.brand) ? 1 : 0;
// The dupe to suggest for a classic: in budget first, then quality houses, then cheapest.
const bestDupe = c => dupesOf(c).sort((a, b) => fits(b) - fits(a) || dupeRank(b) - dupeRank(a) || low(a) - low(b) || 0)[0];

// "That's a green fragrance": names the smell, shows the classic, and offers the dupe when the classic costs too much.
function familyCard([, , , family, meaning, classic]) {
  const c = find(classic);
  if (!c) return '';
  const d = quiz.kind === 'original' ? null : bestDupe(c);
  const over = range()[1] > 0 && low(c) > range()[1];
  const off = d && low(c) < Infinity && low(d) < low(c) ? Math.round(100 * (1 - low(d) / low(c))) : 0;
  const side = (f, tag, note) => `<a class="side" href="${href(f)}">${art(f, 'thumb')}<div><div class="label">${tag}</div>
    <div class="name">${esc(f.name)}</div><div class="brand">${esc(f.brand)}</div><div class="tprice">${priceText(f)}</div>${note ? `<div class="why">${esc(note)}</div>` : ''}</div></a>`;
  return `<article class="fam"><div class="label">What you're describing</div><h3>That's ${esc(family)} fragrance.</h3><p>${esc(meaning)}</p>
    <div class="pair">${side(c, 'The classic', over ? 'Outside your budget' : '')}
    ${d ? side(d, over ? 'Try this instead' : 'Spend less', `${QUALITY_HOUSES.has(d.brand) ? 'Quality dupe house, not a knockoff' : 'A close dupe'}${off ? `. ${off}% less` : ''}`) : ''}</div></article>`;
}

function renderPicks() {
  const want = quiz.vibes.map(v => VIBES.find(x => x[0] === v));
  const shown = new Set(want.flatMap(v => { const c = find(v[5]); return c ? [c, bestDupe(c)] : []; }));
  const scored = pool().filter(f => f.image && !shown.has(f) && fits(f) && (quiz.kind === 'any' || (quiz.kind === 'dupe') === isDupeHouse(f))).map(f => {
    const top = acc(f).slice(0, 6);
    let s = 0;
    const why = [];
    for (const [label, , names] of want) {
      // The vibe's main accord has to be prominent, or 'green' matches anything vaguely herbal.
      if (!top.slice(0, 3).some(a => a.name === names[0])) continue;
      const hit = top.filter(a => names.includes(a.name)).reduce((t, a) => t + (a.name === names[0] ? 2 : 1) * a.pct / 100, 0);
      if (hit) { s += hit; why.push(label); }
    }
    return { f, s, why };
  }).filter(x => x.s >= 1).sort((a, b) => b.s - a.s);
  // Mostly designers and niche, then a few dupes: quality houses and known dupes first.
  const designers = scored.filter(x => !isDupeHouse(x.f) && !BUDGET_HOUSES.has(x.f.brand));
  const dupes = scored.filter(x => isDupeHouse(x.f)).sort((a, b) => dupeRank(b.f) - dupeRank(a.f) || !!b.f.dupeOf - !!a.f.dupeOf);
  const picks = [...new Set([...designers.slice(0, 8), ...dupes.slice(0, 4), ...scored])].slice(0, 12);
  $('quiz').innerHTML = `<div class="sub" style="margin-top:0"><h2>Your matches</h2><button class="link" data-qreset>Start over</button></div>
    ${want.slice(0, 3).map(familyCard).join('')}
    ${picks.length ? `<div class="sub"><h2>More in your budget</h2></div><div class="grid dense">${picks.map(({ f, why }, i) => tile(f, i,
      `<div class="tprice">${priceText(f)}</div><div class="why">${esc(why.join(' + '))}</div>`)).join('')}</div>`
    : '<p class="none">Nothing else fits all of that. Try a bigger budget or more scents.</p>'}`;
}

/* ---------- Fragrance page ---------- */
const accordBars = f => `<div class="accords">${acc(f).slice(0, 7).map((a, i) =>
  `<div class="acc" style="--ink:${ink(a.color)}"><span>${a.name.toLowerCase()}</span><i style="--w:${a.pct}%;--c:${a.color};--i:${i}"></i></div>`).join('')}</div>`;
const tier = (label, notes) => notes.length ? `<div><span>${label}</span><div class="chips">${notes.map(n =>
  `<button class="chip dot" data-q="${esc(n)}" style="--c:${accordsOf([n])[0]?.color || '#ccc'}">${esc(n)}</button>`).join('')}</div></div>` : '';
const sharesNotes = f => {
  const mine = new Set(notesOf(f).map(n => n.toLowerCase()));
  return data.fragrances.filter(g => g !== f)
    .map(g => [g, notesOf(g).filter(n => mine.has(n.toLowerCase())).length])
    .filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).map(([g]) => g);
};
function starsHtml(f) {
  if (!ratings) return '';
  const r = ratings[slug(f)], mine = Number(store.get('vote:' + slug(f))) || 0;
  const shown = Math.round(mine || (r?.count ? r.sum / r.count : 0));
  return `<h4>Rate it</h4><div class="stars" data-slug="${slug(f)}">${[1, 2, 3, 4, 5].map(n =>
    `<button data-star="${n}" class="${n <= shown ? 'on' : ''}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}
    <span>${r?.count ? `${(r.sum / r.count).toFixed(1)} · ${plural(r.count, 'vote')}` : 'No votes yet'}${mine ? ' · yours: ' + mine : ''}</span></div>`;
}
function fragPage(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const listed = f.similar.map(s => find(s) || s);
  const similar = [...new Set([...listed.filter(x => typeof x !== 'string'), ...sharesNotes(f)])].filter(g => g !== o && !mine.includes(g)).slice(0, 6);
  const outside = listed.filter(x => typeof x === 'string');
  return `<button class="back link" data-back>← Back</button>
    <div class="page">
      ${art(f, 'big')}
      <div>
        <div class="brand">${esc(f.brand)}</div>
        <h1>${esc(f.name)}</h1>
        <div class="meta">${GENDER[f.gender] || ''}</div>
        ${o ? `<a class="dupeof" href="${href(o)}">Dupe of ${esc(full(o))} →</a>` : f.dupeOf ? `<span class="dupeof">Dupe of ${esc(f.dupeOf)}</span>` : ''}
        <div class="from" id="from" aria-live="polite"></div>
        <h4>Main accords</h4>${accordBars(f)}
        <h4>Where to buy</h4><ul class="rows" id="prices"><li><small>Checking prices…</small></li></ul>
        <div id="stars">${starsHtml(f)}</div>
      </div>
    </div>
    <h4>Notes</h4><div class="pyr">${tier('Top', f.notes.top)}${tier('Heart', f.notes.heart)}${tier('Base', f.notes.base)}</div>
    <p class="fine">Notes compiled by hand from brand and store listings${f.source ? ` (<a href="${esc(f.source)}" ${ext}>source ↗</a>)` : ''}. Accords worked out from these notes. Spot a mistake? Check Fragrantica.</p>
    ${mine.length ? `<h4>Dupes</h4><div class="grid">${mine.map((d, i) => tile(d, i)).join('')}</div>` : ''}
    ${similar.length ? `<h4>Smells like…</h4><div class="grid">${similar.map((g, i) => tile(g, i)).join('')}</div>` : ''}
    ${outside.length ? `<h4>Also try</h4><div class="chips">${outside.map(s => `<a class="chip" href="https://www.fragrantica.com/search/?query=${enc(s)}" ${ext}>${esc(s)} ↗</a>`).join('')}</div>` : ''}
    <a class="more" href="https://www.fragrantica.com/search/?query=${enc(full(f))}" ${ext}>Fragrantica page ↗</a>`;
}

const perMl = p => p.price / p.size;
// Daily snapshot (scripts/prices.mjs) for tiles, sorting and budgets; the fragrance page adds a live check on top.
let snap = {};
const stored = f => snap[slug(f)] || [];
// Lowest price for a full-size bottle (75-130 ml) so a 30 ml or a decant doesn't pose as the deal; any size if that's all there is.
const low = f => {
  const p = stored(f), full = p.filter(x => x.size >= 75 && x.size <= 130);
  return p.length ? Math.min(...(full.length ? full : p).map(x => x.price)) : Infinity;
};
const priceCache = new Map();
function fetchPrices(f) { // live prices need the /api/prices function (Cloudflare); without it, store links only
  if (!priceCache.has(f)) priceCache.set(f, fetch(`/api/prices?q=${enc(full(f))}&name=${enc(f.name)}&brand=${enc(f.brand)}`)
    .then(r => r.ok && r.headers.get('content-type')?.includes('json') ? r.json() : { prices: [] })
    .then(d => d.prices).catch(() => []));
  return priceCache.get(f);
}
const cheapest = list => list.length ? list.reduce((a, b) => perMl(b) < perMl(a) ? b : a) : null;

async function loadPrices(f) {
  const q = full(f);
  const o = originalOf(f);
  // Live prices win per store; the snapshot fills in stores the live check missed (throttled, timed out).
  const both = async g => { const l = await fetchPrices(g); return [...l, ...stored(g).filter(s => !l.some(x => x.store === s.store))]; };
  const [live, orig] = await Promise.all([both(f), o ? both(o) : []]);
  const el = $('prices');
  if (!el || !location.hash.endsWith(slug(f))) return; // left the page
  const best = live.length > 1 ? cheapest(live) : null;
  const top = cheapest(live), otop = cheapest(orig);
  // Headline: best price per ml, and for a dupe how far under the original it lands.
  $('from').innerHTML = top ? `<b>$${top.price.toFixed(2)}</b><span>${top.size} ml at ${esc(top.store)} · $${perMl(top).toFixed(2)}/ml</span>
    ${otop && perMl(top) < perMl(otop) ? `<em>${Math.round(100 * (1 - perMl(top) / perMl(otop)))}% less per ml than ${esc(o.name)}</em>` : ''}` : '';
  const rows = live.sort((a, b) => perMl(a) - perMl(b)).map(p => `<li>
      <a href="${esc(p.url)}" ${ext}>${esc(p.store)}</a>${trust(p.store)}${p === best ? '<span class="best">Best value</span>' : ''}
      <small>${p.size} ml · $${perMl(p).toFixed(2)}/ml</small><span class="r">$${p.price.toFixed(2)}</span></li>`);
  const priced = new Set(live.map(p => p.store));
  for (const [s, url] of Object.entries(data.stores)) {
    if (!priced.has(s)) rows.push(`<li><a href="${url}${enc(q)}" ${ext}>${esc(s)}</a>${trust(s)}<span class="r"><small>See price ↗</small></span></li>`);
  }
  el.innerHTML = rows.join('');
}
// Stores we've bought from and trust.
const TRUSTED = new Set(['Arvella', 'Beauty House']);
const trust = s => TRUSTED.has(s) ? '<span class="trust" title="Trusted store" aria-label="Trusted store">★</span>' : '';

async function vote(slugId, stars) {
  try {
    const r = await fetch('/api/ratings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug: slugId, stars }) });
    if (!r.ok) return;
    const t = await r.json();
    ratings[slugId] = { sum: t.sum, count: t.count };
    store.set('vote:' + slugId, stars);
    $('stars').innerHTML = starsHtml(data.fragrances.find(f => slug(f) === slugId));
    renderTop();
  } catch {}
}

/* ---------- Shell ---------- */
function setGender(g) {
  gender = g;
  store.set('gender', g);
  for (const b of document.querySelectorAll('.seg button[data-g]')) b.setAttribute('aria-pressed', b.dataset.g === g);
  renderExplore(); renderDupes();
  if (quiz.step === 3) renderPicks();
}
function route() {
  const [tab, id] = location.hash.slice(1).split('/');
  let view = ['explore', 'dupes', 'match'].includes(tab) ? tab : 'explore';
  const f = tab === 'f' && data.fragrances.find(x => slug(x) === id);
  if (f) {
    view = 'page';
    $('page').innerHTML = fragPage(f);
    document.title = `${full(f)} · Fragrance Unlocked`;
    loadPrices(f);
  } else document.title = 'Fragrance Unlocked';
  for (const s of document.querySelectorAll('section.view')) s.hidden = s.id !== view;
  for (const a of document.querySelectorAll('.tabs a')) {
    if (a.hash === '#' + view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  scrollTo(0, 0);
  requestAnimationFrame(fill); // a list that was hidden may need its first pages now
}

document.addEventListener('click', e => {
  const t = e.target;
  const k = t.closest('[data-kind]');
  if (k) {
    filt.kind = k.dataset.kind;
    for (const b of document.querySelectorAll('[data-kind]')) b.setAttribute('aria-pressed', b === k);
    return resetFeed();
  }
  const g = t.closest('.seg button');
  if (g) return setGender(g.dataset.g);
  const star = t.closest('[data-star]');
  if (star) return vote(star.closest('.stars').dataset.slug, Number(star.dataset.star));
  const choice = t.closest('[data-key]');
  if (choice) {
    const { key, val } = choice.dataset;
    if (key === 'budget') Object.assign(quiz, { budget: val, step: 1 });
    else if (key === 'kind') Object.assign(quiz, { kind: val, step: 2 });
    else quiz.vibes = quiz.vibes.includes(val) ? quiz.vibes.filter(v => v !== val) : [...quiz.vibes, val];
    return renderQuiz();
  }
  if (t.closest('[data-qback]')) { quiz.step--; return renderQuiz(); }
  if (t.closest('[data-qdone]')) { quiz.step = 3; return renderQuiz(); }
  if (t.closest('[data-qreset]')) { quiz = fresh(); return renderQuiz(); }
  if (t.closest('[data-back]')) return history.length > 1 ? history.back() : (location.hash = 'explore');
  const q = t.closest('[data-q]')?.dataset.q;
  if (q) { $('q').value = q; location.hash = 'explore'; resetFeed(); setTimeout(() => $('feedTitle').scrollIntoView({ behavior: 'smooth' }), 50); }
});
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const flip = () => { document.documentElement.dataset.theme = dark ? 'light' : 'dark'; };
  // One clean crossfade of the whole page instead of every element easing at its own speed.
  document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches ? document.startViewTransition(flip) : flip();
  store.set('theme', dark ? 'light' : 'dark');
};
$('shuffle').onclick = $('again').onclick = () => resetFeed();
$('sort').onchange = resetFeed;
$('filterBtn').onclick = () => {
  const open = $('filters').hidden;
  $('filters').hidden = !open;
  $('filterBtn').setAttribute('aria-expanded', open);
};
$('faccord').onchange = e => { filt.accord = e.target.value; resetFeed(); };
$('fbrand').onchange = e => { filt.brand = e.target.value; resetFeed(); };
$('fclear').onclick = () => {
  Object.assign(filt, { kind: 'all', accord: '', brand: '' });
  $('faccord').value = $('fbrand').value = '';
  for (const b of document.querySelectorAll('[data-kind]')) b.setAttribute('aria-pressed', b.dataset.kind === 'all');
  resetFeed();
};

[data, snap, ratings] = await Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('prices.json').then(r => r.ok ? r.json() : {}).then(j => j.prices || {}).catch(() => ({})),
  fetch('/api/ratings').then(r => r.ok && r.headers.get('content-type')?.includes('json') ? r.json() : null).catch(() => null), // null: ratings off
]);
const notes = [...new Set(data.fragrances.flatMap(notesOf))].slice(0, 36);
$('marquee').innerHTML = chipQ([...notes, ...notes]);
renderQuiz();
fillFilters();
$('q').addEventListener('input', resetFeed);
$('dq').addEventListener('input', renderDupes);
addEventListener('scroll', fill, { passive: true });
addEventListener('resize', fill);
setGender(['both', 'men', 'women'].includes(gender) ? gender : 'both');
addEventListener('hashchange', route);
route();
</script>
</body>
</html>

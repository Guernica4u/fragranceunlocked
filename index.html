<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragrance Unlocked</title>
<meta name="description" content="Smell expensive. Pay honest. Notes, accords, prices and dupes.">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<nav>
  <div class="bar">
    <a class="logo" href="#explore">Fragrance <b>Unlocked</b></a>
    <div class="tabs">
      <a href="#explore">Explore</a>
      <a href="#dupes">Dupes</a>
      <a href="#match">Match me</a>
    </div>
    <div class="settings">
      <div class="seg" role="group" aria-label="Show fragrances for">
        <button data-g="both">Both</button><button data-g="men">Men</button><button data-g="women">Women</button>
      </div>
      <button class="theme" id="theme" aria-label="Switch light or dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="wrap">
  <section id="explore" class="view" hidden>
    <div class="hero">
      <h1><span style="--i:0">Smell</span> <span style="--i:1">expensive.</span><br><span style="--i:2"><em>Pay</em></span> <span style="--i:3"><em>honest.</em></span></h1>
      <p>Notes. Prices. Dupes. One place.</p>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="find">
      <label for="q" hidden>Search by name, brand or note</label>
      <input id="q" type="search" placeholder="Search name, brand or note" autocomplete="off">
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="marquee" aria-label="Notes"><div id="marquee"></div></div>
    <div id="top"></div>
    <div class="sub"><h2 id="feedTitle">Explore</h2><button class="link" id="shuffle">Shuffle</button></div>
    <div class="grid" id="feed"></div>
    <div id="sentinel"></div>
    <div class="end" id="end" hidden><button class="btn" id="again">That's all. Shuffle again</button></div>
  </section>

  <section id="dupes" class="view narrow" hidden>
    <div class="head">
      <h2>Dupes</h2>
      <p>Type any fragrance. See what it dupes, or what dupes it.</p>
      <label for="dq" hidden>Search any fragrance</label>
      <input id="dq" type="search" placeholder="9PM, Aventus, Cloud…" autocomplete="off">
      <div class="count" id="dcount" aria-live="polite"></div>
    </div>
    <div id="dout"></div>
  </section>

  <section id="match" class="view" hidden>
    <div class="head"><h2>Match me</h2><p>Three questions. Then your picks.</p></div>
    <div id="quiz"></div>
  </section>

  <section id="page" class="view" hidden></section>
</div>

<script type="module">
import { accords as accordsOf, ink } from './accords.js';
import { norm, slug } from './shared.js';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const $ = id => document.getElementById(id);
const ext = 'target="_blank" rel="noopener"';
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let data, ratings = null, gender = store.get('gender') || 'both';

const GENDER = { men: 'For men', women: 'For women', unisex: 'Unisex' };

const notesOf = f => [...f.notes.top, ...f.notes.heart, ...f.notes.base];
const pool = () => data.fragrances.filter(f => gender === 'both' || f.gender === gender || f.gender === 'unisex');
const accCache = new Map();
const acc = f => accCache.get(f) || accCache.set(f, accordsOf(notesOf(f))).get(f);
const dots = f => `<div class="dots">${acc(f).slice(0, 3).map(a => `<span style="--c:${a.color}">${a.name}</span>`).join('')}</div>`;
const full = f => `${f.brand} ${f.name}`;
const href = f => `#f/${slug(f)}`;
const find = name => data.fragrances.find(f => slug(f) === norm(name));
// Dupes of a fragrance: entries that say they dupe it, plus names it lists.
const dupesOf = f => data.fragrances.filter(d => d.dupeOf && norm(d.dupeOf) === slug(f));
const originalOf = f => f.dupeOf ? find(f.dupeOf) : null;

const SHAPES = [
  'M16 38a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v64a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8z',
  'M40 36a36 36 0 1 1 0 72a36 36 0 1 1 0-72z',
  'M8 54a14 14 0 0 1 14-14h36a14 14 0 0 1 14 14v42a14 14 0 0 1-14 14H22a14 14 0 0 1-14-14z',
];
let gid = 0;
function art(f, cls = '', style = '') {
  const open = `<div class="art ${cls}" style="${style}">`;
  if (f.image) return `${open}<img src="${esc(f.image)}&width=${cls === 'big' ? 700 : 400}" alt="${esc(full(f))} bottle" loading="lazy"></div>`;
  const c = acc(f).slice(0, 3).map(a => a.color);
  if (!c.length) c.push('#d8d2c8');
  if (c.length < 2) c.push(c[0]);
  const shape = SHAPES[[...f.name].reduce((h, ch) => h + ch.charCodeAt(0), 0) % SHAPES.length];
  const id = 'g' + gid++;
  const stops = c.map((x, j) => `<stop offset="${j / (c.length - 1)}" stop-color="${x}"/>`).join('');
  return `${open}<svg viewBox="0 0 80 112" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".4" y2="1">${stops}</linearGradient></defs>
    <rect x="29" y="2" width="22" height="20" rx="4" fill="#3a3f46"/><rect x="34" y="21" width="12" height="12" fill="#3a3f46" opacity=".8"/>
    <path d="${shape}" fill="url(#${id})"/><path d="${shape}" fill="none" stroke="#000" stroke-opacity=".08"/>
    <rect x="22" y="48" width="5" height="34" rx="2.5" fill="#fff" opacity=".4"/></svg></div>`;
}

const chipQ = list => list.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');
const avg = f => { const r = ratings?.[slug(f)]; return r?.count ? r.sum / r.count : 0; };
function tile(f, i, extra = '') {
  const n = dupesOf(f).length;
  const r = ratings?.[slug(f)];
  return `<a class="tile" href="${href(f)}" style="--i:${i}">
    ${f.dupeOf ? '<span class="pill left">Dupe</span>' : ''}${n ? `<span class="pill">${plural(n, 'dupe')}</span>` : ''}
    ${art(f)}<div class="name">${esc(f.name)}</div><div class="brand">${esc(f.brand)}${r?.count ? ` · ★ ${avg(f).toFixed(1)}` : ''}</div>${dots(f)}${extra}</a>`;
}

/* ---------- Explore (with search) ---------- */
let feed = [], shown = 0;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const has = (q, fields) => fields.join(' ').toLowerCase().includes(q);
function resetFeed() {
  const q = $('q').value.trim().toLowerCase();
  feed = q ? pool().filter(f => has(q, [f.brand, f.name, ...notesOf(f), ...acc(f).map(a => a.name)])) : shuffle(pool());
  $('count').textContent = q ? plural(feed.length, 'match', 'matches') : '';
  $('feedTitle').textContent = q ? `Results for ${$('q').value.trim()}` : 'Explore';
  $('shuffle').hidden = !!q;
  shown = 0;
  $('feed').innerHTML = feed.length ? '' : `<p class="none">Nothing yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a></p>`;
  moreFeed();
}
function moreFeed() {
  const next = feed.slice(shown, shown + 9);
  $('feed').insertAdjacentHTML('beforeend', next.map((f, i) => tile(f, i)).join(''));
  shown += next.length;
  $('end').hidden = shown < feed.length || !feed.length || !!$('q').value.trim();
}
function renderTop() {
  const top = pool().filter(f => ratings?.[slug(f)]?.count)
    .sort((a, b) => avg(b) - avg(a) || ratings[slug(b)].count - ratings[slug(a)].count).slice(0, 3);
  $('top').innerHTML = top.length ? `<div class="sub"><h2>Top rated</h2><small>Voted by visitors</small></div>
    <div class="grid">${top.map((f, i) => tile(f, i)).join('')}</div>` : '';
}
function renderExplore() {
  $('shelf').innerHTML = shuffle(pool().filter(f => f.image)).slice(0, 6).map((f, i) => art(f, '', `--i:${i}`)).join('');
  renderTop();
  resetFeed();
}

/* ---------- Dupes: what does it dupe, what dupes it ---------- */
function verdict(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const parts = [];
  if (f.dupeOf) parts.push(`Dupe of ${o ? `<a href="${href(o)}">${esc(full(o))}</a>` : esc(f.dupeOf)}.`);
  if (mine.length) parts.push(`Its dupes:<div class="chips">${mine.map(d => `<a class="chip" href="${href(d)}">${esc(full(d))} →</a>`).join('')}</div>`);
  if (!parts.length) parts.push('Not a dupe. No known dupes yet.');
  return parts.join(' ');
}
const box = f => `<article class="box">
    <a class="top" href="${href(f)}">${art(f, 'thumb')}<div><div class="label">${f.dupeOf ? 'Dupe' : 'Original'}</div><h3>${esc(f.name)}</h3><div class="brand">${esc(f.brand)}</div></div></a>
    <div class="verdict">${verdict(f)}</div></article>`;
function renderDupes() {
  const q = $('dq').value.trim().toLowerCase();
  const hits = q ? pool().filter(f => has(q, [f.brand, f.name, full(f)]))
    : pool().filter(f => dupesOf(f).length);
  $('dcount').textContent = q ? plural(hits.length, 'match', 'matches') : `${hits.length} originals with dupes`;
  $('dout').innerHTML = hits.map(box).join('')
    || `<p class="none" style="text-align:center;margin-top:32px">Not in our list yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a></p>`;
}

/* ---------- Match me: budget, then dupe or original, then a vibe ---------- */
const VIBES = [
  ['Apple pie & ice cream', 'Warm, sweet, cozy', ['Sweet', 'Vanilla', 'Fruity', 'Warm spicy', 'Nutty']],
  ['A brand-new leather boot', 'Rich, smoky, grown-up', ['Leather', 'Smoky', 'Woody']],
  ['A day at the beach', 'Salt air, citrus, sun', ['Aquatic', 'Citrus', 'Fresh', 'Tropical']],
  ['A forest after rain', 'Green, woody, earthy', ['Woody', 'Green', 'Earthy', 'Aromatic']],
  ['A flower shop', 'Petals everywhere', ['Floral', 'White floral', 'Rose', 'Powdery']],
  ['Fresh laundry', 'Clean, soft, skin-like', ['Musky', 'Powdery', 'Fresh', 'Aromatic']],
  ['A spice market', 'Pepper, saffron, warmth', ['Warm spicy', 'Fresh spicy', 'Amber']],
  ['A campfire', 'Smoke, resin, embers', ['Smoky', 'Amber', 'Woody', 'Oud']],
  ['A coffee shop', 'Espresso and pastry', ['Coffee', 'Sweet', 'Nutty', 'Vanilla']],
  ['A fruit stand', 'Juicy and bright', ['Fruity', 'Citrus', 'Tropical']],
];
const BUDGETS = [['Under $50', 'Dupes and budget gems', 50], ['Under $100', 'Lots of designers', 100], ['Under $200', 'Most designers', 200], ['No limit', 'Niche included', 0]];
const KINDS = [['A dupe', 'Smells close, costs less', 'dupe'], ['The original', 'The real thing', 'original'], ['Either', 'Show me both', 'any']];
const fresh = () => ({ step: 0, budget: null, kind: null, vibes: [] });
let quiz = fresh(), quizRun = 0;

const opt = (key, label, sub, value, on) =>
  `<button class="opt" data-key="${key}" data-val="${esc(value)}" aria-pressed="${on}">${esc(label)}<small>${esc(sub)}</small></button>`;
function renderQuiz() {
  const { step, budget, kind, vibes } = quiz;
  if (step === 3) return renderPicks();
  const [title, hint, opts] = [
    ['What can you spend?', 'For a full bottle, about 100 ml.', BUDGETS.map(([l, s, v]) => opt('budget', l, s, v, v === budget))],
    ['Dupe or the real thing?', 'Dupes get you close for a lot less.', KINDS.map(([l, s, v]) => opt('kind', l, s, v, v === kind))],
    ['What do you want to smell like?', 'Pick as many as you like.', VIBES.map(([l, s]) => opt('vibe', l, s, l, vibes.includes(l)))],
  ][step];
  $('quiz').innerHTML = `<div class="qstep">
    <div class="progress">${[0, 1, 2].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
    <div class="label">Question ${step + 1} of 3</div><h3>${title}</h3><p class="hint">${hint}</p>
    <div class="opts">${opts.join('')}</div>
    <div class="qnav">${step ? '<button class="link" data-qback>← Back</button>' : '<span></span>'}
      ${step === 2 ? `<button class="btn" data-qdone ${vibes.length ? '' : 'disabled'}>See my matches</button>` : ''}</div></div>`;
}
async function renderPicks() {
  const run = ++quizRun;
  const want = quiz.vibes.map(v => VIBES.find(x => x[0] === v));
  const scored = pool().filter(f => quiz.kind === 'any' || (quiz.kind === 'dupe') === !!f.dupeOf).map(f => {
    const top = acc(f).slice(0, 6);
    let s = 0;
    const why = [];
    for (const [label, , names] of want) {
      const hit = top.filter(a => names.includes(a.name)).reduce((t, a) => t + a.pct / 100, 0);
      if (hit) { s += hit; why.push(label); }
    }
    return { f, s, why };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 15);
  const head = '<div class="sub" style="margin-top:0"><h2>Your picks</h2><button class="link" data-qreset>Start over</button></div>';
  $('quiz').innerHTML = head + '<p class="none">Checking prices…</p>';
  const prices = await Promise.all(scored.map(x => fetchPrices(x.f)));
  if (run !== quizRun) return; // answers changed while prices loaded
  const live = prices.some(p => p.length); // false where the price API isn't running
  const low = list => list.length ? Math.min(...list.map(p => p.price)) : null;
  const picks = scored.map((x, i) => ({ ...x, low: low(prices[i]) }))
    .filter(x => !quiz.budget || !live || (x.low != null && x.low <= quiz.budget)).slice(0, 6);
  $('quiz').innerHTML = head + (picks.length ? `<div class="grid">${picks.map(({ f, why, low }, i) => tile(f, i,
      `<div class="why">${esc(why.join(' + '))}</div>${low != null ? `<div class="tprice">From $${low.toFixed(2)}</div>` : ''}`)).join('')}</div>`
    : '<p class="none">Nothing fits all of that. Try a bigger budget or more scents.</p>')
    + (quiz.budget && !live ? `<p class="fine">Live prices are off right now, so your budget isn't applied.</p>` : '');
}

/* ---------- Fragrance page ---------- */
const accordBars = f => `<div class="accords">${acc(f).slice(0, 7).map((a, i) =>
  `<div class="acc" style="--ink:${ink(a.color)}"><span>${a.name.toLowerCase()}</span><i style="--w:${a.pct}%;--c:${a.color};--i:${i}"></i></div>`).join('')}</div>`;
const tier = (label, notes) => notes.length ? `<div><span>${label}</span><div class="chips">${notes.map(n =>
  `<button class="chip dot" data-q="${esc(n)}" style="--c:${accordsOf([n])[0]?.color || '#ccc'}">${esc(n)}</button>`).join('')}</div></div>` : '';
const sharesNotes = f => {
  const mine = new Set(notesOf(f).map(n => n.toLowerCase()));
  return data.fragrances.filter(g => g !== f)
    .map(g => [g, notesOf(g).filter(n => mine.has(n.toLowerCase())).length])
    .filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).map(([g]) => g);
};
function starsHtml(f) {
  if (!ratings) return '';
  const r = ratings[slug(f)], mine = Number(store.get('vote:' + slug(f))) || 0;
  const shown = Math.round(mine || (r?.count ? r.sum / r.count : 0));
  return `<h4>Rate it</h4><div class="stars" data-slug="${slug(f)}">${[1, 2, 3, 4, 5].map(n =>
    `<button data-star="${n}" class="${n <= shown ? 'on' : ''}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}
    <span>${r?.count ? `${(r.sum / r.count).toFixed(1)} · ${plural(r.count, 'vote')}` : 'No votes yet'}${mine ? ' · yours: ' + mine : ''}</span></div>`;
}
function fragPage(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const listed = f.similar.map(s => find(s) || s);
  const similar = [...new Set([...listed.filter(x => typeof x !== 'string'), ...sharesNotes(f)])].filter(g => g !== o && !mine.includes(g)).slice(0, 6);
  const outside = listed.filter(x => typeof x === 'string');
  return `<button class="back link" data-back>← Back</button>
    <div class="page">
      ${art(f, 'big')}
      <div>
        <div class="brand">${esc(f.brand)}</div>
        <h1>${esc(f.name)}</h1>
        <div class="meta">${GENDER[f.gender] || ''}</div>
        ${o ? `<a class="dupeof" href="${href(o)}">Dupe of ${esc(full(o))} →</a>` : f.dupeOf ? `<span class="dupeof">Dupe of ${esc(f.dupeOf)}</span>` : ''}
        <div class="from" id="from" aria-live="polite"></div>
        <h4>Main accords</h4>${accordBars(f)}
        <h4>Where to buy</h4><ul class="rows" id="prices"><li><small>Checking prices…</small></li></ul>
        <div id="stars">${starsHtml(f)}</div>
      </div>
    </div>
    <h4>Notes</h4><div class="pyr">${tier('Top', f.notes.top)}${tier('Heart', f.notes.heart)}${tier('Base', f.notes.base)}</div>
    <p class="fine">Notes compiled by hand from brand and store listings${f.source ? ` (<a href="${esc(f.source)}" ${ext}>source ↗</a>)` : ''}. Accords worked out from these notes. Spot a mistake? Check Fragrantica.</p>
    ${mine.length ? `<h4>Dupes</h4><div class="grid">${mine.map((d, i) => tile(d, i)).join('')}</div>` : ''}
    ${similar.length ? `<h4>Smells like…</h4><div class="grid">${similar.map((g, i) => tile(g, i)).join('')}</div>` : ''}
    ${outside.length ? `<h4>Also try</h4><div class="chips">${outside.map(s => `<a class="chip" href="https://www.fragrantica.com/search/?query=${enc(s)}" ${ext}>${esc(s)} ↗</a>`).join('')}</div>` : ''}
    <a class="more" href="https://www.fragrantica.com/search/?query=${enc(full(f))}" ${ext}>Fragrantica page ↗</a>`;
}

const perMl = p => p.price / p.size;
const priceCache = new Map();
function fetchPrices(f) { // live prices need the /api/prices function (Cloudflare); without it, store links only
  if (!priceCache.has(f)) priceCache.set(f, fetch(`/api/prices?q=${enc(full(f))}&name=${enc(f.name)}&brand=${enc(f.brand)}`)
    .then(r => r.ok && r.headers.get('content-type')?.includes('json') ? r.json() : { prices: [] })
    .then(d => d.prices).catch(() => []));
  return priceCache.get(f);
}
const cheapest = list => list.length ? list.reduce((a, b) => perMl(b) < perMl(a) ? b : a) : null;

async function loadPrices(f) {
  const q = full(f);
  const o = originalOf(f);
  const [live, orig] = await Promise.all([fetchPrices(f), o ? fetchPrices(o) : []]);
  const el = $('prices');
  if (!el || !location.hash.endsWith(slug(f))) return; // left the page
  const best = live.length > 1 ? cheapest(live) : null;
  const top = cheapest(live), otop = cheapest(orig);
  // Headline: best price per ml, and for a dupe how far under the original it lands.
  $('from').innerHTML = top ? `<b>$${top.price.toFixed(2)}</b><span>${top.size} ml at ${esc(top.store)} · $${perMl(top).toFixed(2)}/ml</span>
    ${otop && perMl(top) < perMl(otop) ? `<em>${Math.round(100 * (1 - perMl(top) / perMl(otop)))}% less per ml than ${esc(o.name)}</em>` : ''}` : '';
  const rows = live.sort((a, b) => perMl(a) - perMl(b)).map(p => `<li>
      <a href="${esc(p.url)}" ${ext}>${esc(p.store)}</a>${p === best ? '<span class="best">Best value</span>' : ''}
      <small>${p.size} ml · $${perMl(p).toFixed(2)}/ml</small><span class="r">$${p.price.toFixed(2)}</span></li>`);
  const priced = new Set(live.map(p => p.store));
  for (const [s, url] of Object.entries(data.stores)) {
    if (!priced.has(s)) rows.push(`<li><a href="${url}${enc(q)}" ${ext}>${esc(s)}</a><span class="r"><small>See price ↗</small></span></li>`);
  }
  el.innerHTML = rows.join('');
}

async function vote(slugId, stars) {
  try {
    const r = await fetch('/api/ratings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug: slugId, stars }) });
    if (!r.ok) return;
    const t = await r.json();
    ratings[slugId] = { sum: t.sum, count: t.count };
    store.set('vote:' + slugId, stars);
    $('stars').innerHTML = starsHtml(data.fragrances.find(f => slug(f) === slugId));
    renderTop();
  } catch {}
}

/* ---------- Shell ---------- */
function setGender(g) {
  gender = g;
  store.set('gender', g);
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.g === g);
  renderExplore(); renderDupes();
  if (quiz.step === 3) renderPicks();
}
function route() {
  const [tab, id] = location.hash.slice(1).split('/');
  let view = ['explore', 'dupes', 'match'].includes(tab) ? tab : 'explore';
  const f = tab === 'f' && data.fragrances.find(x => slug(x) === id);
  if (f) {
    view = 'page';
    $('page').innerHTML = fragPage(f);
    document.title = `${full(f)} · Fragrance Unlocked`;
    loadPrices(f);
  } else document.title = 'Fragrance Unlocked';
  for (const s of document.querySelectorAll('section.view')) s.hidden = s.id !== view;
  for (const a of document.querySelectorAll('.tabs a')) {
    if (a.hash === '#' + view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('.seg button');
  if (g) return setGender(g.dataset.g);
  const star = t.closest('[data-star]');
  if (star) return vote(star.closest('.stars').dataset.slug, Number(star.dataset.star));
  const choice = t.closest('[data-key]');
  if (choice) {
    const { key, val } = choice.dataset;
    if (key === 'budget') Object.assign(quiz, { budget: Number(val), step: 1 });
    else if (key === 'kind') Object.assign(quiz, { kind: val, step: 2 });
    else quiz.vibes = quiz.vibes.includes(val) ? quiz.vibes.filter(v => v !== val) : [...quiz.vibes, val];
    return renderQuiz();
  }
  if (t.closest('[data-qback]')) { quiz.step--; return renderQuiz(); }
  if (t.closest('[data-qdone]')) { quiz.step = 3; return renderQuiz(); }
  if (t.closest('[data-qreset]')) { quiz = fresh(); return renderQuiz(); }
  if (t.closest('[data-back]')) return history.length > 1 ? history.back() : (location.hash = 'explore');
  const q = t.closest('[data-q]')?.dataset.q;
  if (q) { $('q').value = q; location.hash = 'explore'; resetFeed(); setTimeout(() => $('feedTitle').scrollIntoView({ behavior: 'smooth' }), 50); }
});
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('theme', dark ? 'light' : 'dark');
};
$('shuffle').onclick = $('again').onclick = () => resetFeed();

[data, ratings] = await Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('/api/ratings').then(r => r.ok && r.headers.get('content-type')?.includes('json') ? r.json() : null).catch(() => null), // null: ratings off
]);
const notes = [...new Set(data.fragrances.flatMap(notesOf))].slice(0, 36);
$('marquee').innerHTML = chipQ([...notes, ...notes]);
renderQuiz();
$('q').addEventListener('input', resetFeed);
$('dq').addEventListener('input', renderDupes);
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < feed.length) moreFeed(); }, { rootMargin: '400px' }).observe($('sentinel'));
setGender(['both', 'men', 'women'].includes(gender) ? gender : 'both');
addEventListener('hashchange', route);
route();
</script>
</body>
</html>

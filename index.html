<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragrance Unlocked</title>
<meta name="description" content="Smell expensive. Pay honest. Notes, accords, prices and dupes.">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --fg: #34383e; --bg: #f2f3f5; --card: #fafbfc; --mute: #8a9099; --line: #e1e4e8; --chip: #e8ebef; --accent: #4f6d8f; --tile: transparent; --shadow: 0 1px 2px rgba(20,30,40,.04), 0 8px 24px -14px rgba(20,30,40,.14); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #d3d7dc; --bg: #17191c; --card: #1f2226; --mute: #868c94; --line: #2c3036; --chip: #292d33; --accent: #8fb0d2; --tile: #e6e8eb; --shadow: none; }
  }
  :root[data-theme="dark"] { --fg: #d3d7dc; --bg: #17191c; --card: #1f2226; --mute: #868c94; --line: #2c3036; --chip: #292d33; --accent: #8fb0d2; --tile: #e6e8eb; --shadow: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 Inter, system-ui, sans-serif; overflow-x: hidden; transition: background .3s, color .3s; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 80px; }
  .narrow { max-width: 720px; margin-inline: auto; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* Top bar: name far left, settings far right */
  nav { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "logo tabs settings"; align-items: center; gap: 8px; padding: 10px 20px; }
  .logo { grid-area: logo; justify-self: start; font: italic 1.3rem "Instrument Serif", Georgia, serif; text-decoration: none; white-space: nowrap; }
  .logo b { font-style: normal; color: var(--accent); font-weight: 400; }
  .tabs { grid-area: tabs; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs a { color: var(--mute); text-decoration: none; padding: 6px 12px; border-radius: 10px; font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .2s, color .2s; }
  .tabs a:hover { color: var(--fg); background: var(--chip); }
  .tabs a[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .settings { grid-area: settings; justify-self: end; display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--mute); cursor: pointer; transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .theme { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: grid; place-items: center; }
  .theme svg { width: 17px; height: 17px; }
  .theme .sun, :root[data-theme="dark"] .theme .moon { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme .moon { display: none; } :root:not([data-theme="light"]) .theme .sun { display: block; } }
  @media (max-width: 680px) {
    .bar { grid-template-columns: 1fr auto; grid-template-areas: "logo settings" "tabs tabs"; gap: 6px; padding: 10px 16px; }
    .logo { font-size: 1.1rem; }
    .seg button { padding: 4px 7px; font-size: 12px; }
  }
  section[hidden] { display: none; }
  .view { animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* Product art: store photos have white backgrounds, multiply blends them into light surfaces */
  .art { display: grid; place-items: center; background: var(--tile); border-radius: 14px; overflow: hidden; flex: none; }
  .art img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .art svg { height: 86%; width: auto; }
  .thumb { width: 64px; height: 64px; }

  /* Explore */
  .hero { text-align: center; padding: 10vh 0 12px; }
  .hero h1 { font: 400 clamp(3.2rem, 13vw, 6.2rem)/.92 "Instrument Serif", Georgia, serif; margin: 0; letter-spacing: -0.025em; }
  .hero h1 span { display: inline-block; opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i) * 120ms + 100ms); }
  .hero h1 em { color: var(--accent); }
  .hero p { color: var(--mute); font-size: 1.05rem; margin: 16px 0 0; opacity: 0; animation: rise .9s .7s forwards; }
  .shelf { display: flex; justify-content: center; gap: 14px; margin-top: 30px; }
  .shelf .art { width: 92px; height: 92px; animation: bob 4s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -0.7s); }
  .shelf .art:nth-child(n+4) { display: none; }
  @media (min-width: 560px) { .shelf .art:nth-child(n+4) { display: grid; } }
  @keyframes bob { from { transform: translateY(-6px) rotate(-2deg); } to { transform: translateY(6px) rotate(2deg); } }
  .find { max-width: 560px; margin: 28px auto 0; opacity: 0; animation: rise .9s .85s forwards; }
  .marquee { overflow: hidden; margin: 26px -16px 0; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee > div { display: flex; gap: 8px; width: max-content; animation: slide 70s linear infinite; }
  .marquee:hover > div { animation-play-state: paused; }
  @keyframes slide { to { transform: translateX(-50%); } }
  .sub { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 0 14px; }
  .sub h2 { font: 400 2.1rem/1 "Instrument Serif", Georgia, serif; margin: 0; }
  .sub small { color: var(--mute); }
  .link { border: 0; background: none; color: var(--mute); cursor: pointer; font-size: 13px; padding: 0; text-decoration: none; }
  .link:hover { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 680px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; position: relative; box-shadow: var(--shadow);
          animation: rise .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i) * 60ms); transition: transform .25s, border-color .25s; }
  .tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .tile .art { width: 100%; aspect-ratio: 1; margin-bottom: 10px; }
  .tile .art img { transition: transform .4s; }
  .tile:hover .art img { transform: scale(1.05); }
  .tile .name { font: 400 1.3rem/1.15 "Instrument Serif", Georgia, serif; }
  .pill { position: absolute; top: 10px; right: 10px; z-index: 1; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--card); border-radius: 999px; padding: 1px 8px; }
  .pill.left { right: auto; left: 10px; background: var(--fg); }
  .why { font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 500; }
  .end { text-align: center; margin-top: 28px; }
  .brand { color: var(--mute); font-size: 13px; }
  .dots { font-size: 12px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; color: var(--mute); }
  .dots span::before, .chip.dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .btn { display: inline-block; padding: 11px 20px; border-radius: 12px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--card); cursor: pointer; transition: transform .2s; box-shadow: var(--shadow); }
  .btn:hover { transform: translateY(-2px); }

  /* Shared bits */
  .head { padding: 40px 0 8px; }
  .head h2 { font: 400 2.6rem/1.05 "Instrument Serif", Georgia, serif; margin: 0; }
  .head p { color: var(--mute); margin: 4px 0 0; }
  input { width: 100%; padding: 14px 18px; font: inherit; font-size: 1.05rem; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; outline: none; transition: border-color .2s; box-shadow: var(--shadow); }
  .head input { margin-top: 18px; }
  input:focus { border-color: var(--accent); }
  .count { color: var(--mute); font-size: 13px; margin: 8px 4px 0; min-height: 1.2em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .2s, color .2s; }
  .chip:hover, .chip:focus-visible { background: var(--accent); color: var(--card); outline: none; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .none { color: var(--mute); font-size: 13px; }
  .q { margin-top: 26px; }
  .q h3 { font: 400 1.45rem/1.2 "Instrument Serif", Georgia, serif; margin: 0 0 10px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 12px; box-shadow: var(--shadow); }
  .box .top { display: flex; gap: 14px; align-items: center; text-decoration: none; }
  .box .top h3 { font: 400 1.45rem/1.1 "Instrument Serif", Georgia, serif; margin: 0; }
  .verdict { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .verdict a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .verdict .chips { margin-top: 8px; }

  /* Fragrance page */
  .back { display: inline-block; margin-top: 24px; }
  .page { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 28px; align-items: start; margin-top: 16px; }
  @media (max-width: 640px) { .page { grid-template-columns: 1fr; gap: 18px; } }
  .page .art.big { width: 100%; aspect-ratio: 1; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 22px; padding: 16px; }
  :root[data-theme="dark"] .page .art.big { background: var(--tile); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page .art.big { background: var(--tile); } }
  .page h1 { font: 400 clamp(2.4rem, 7vw, 3.4rem)/1 "Instrument Serif", Georgia, serif; margin: 2px 0 6px; }
  .meta { color: var(--mute); font-size: 14px; }
  .dupeof { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; }
  h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 700; margin: 24px 0 10px; }
  .accords { display: grid; gap: 6px; }
  .acc { height: 26px; border-radius: 8px; background: var(--chip); overflow: hidden; }
  .acc div { height: 100%; width: var(--w); background: var(--c); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; opacity: .9;
             transform-origin: left; animation: grow .8s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i) * 70ms); }
  @keyframes grow { from { transform: scaleX(0); } }
  .fine { color: var(--mute); font-size: 12px; margin-top: 8px; }
  .stars { display: flex; align-items: center; gap: 2px; }
  .stars button { border: 0; background: none; padding: 2px; cursor: pointer; font-size: 24px; line-height: 1; color: var(--line); transition: color .15s, transform .15s; }
  .stars button.on { color: var(--accent); }
  .stars button:hover { transform: scale(1.15); }
  .stars span { margin-left: 8px; color: var(--mute); font-size: 13px; }
  .pyr { display: grid; gap: 10px; }
  .pyr > div { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: baseline; }
  .pyr > div > span { color: var(--mute); font-size: 13px; }
  .rows { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
  .rows li { display: flex; align-items: baseline; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .rows li:last-child { border: 0; }
  .rows a { text-decoration: none; font-weight: 500; }
  .rows a:hover { color: var(--accent); }
  .rows .r { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .rows small { color: var(--mute); font-size: 12px; }
  .best { font-size: 11px; font-weight: 600; color: var(--card); background: var(--accent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .more { display: inline-block; margin-top: 22px; color: var(--mute); font-size: 13px; }
  .more:hover { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero h1 span, .hero p, .find { opacity: 1; }
  }
</style>
</head>
<body>
<nav>
  <div class="bar">
    <a class="logo" href="#explore">Fragrance <b>Unlocked</b></a>
    <div class="tabs">
      <a href="#explore">Explore</a>
      <a href="#dupes">Dupes</a>
      <a href="#match">Match me</a>
    </div>
    <div class="settings">
      <div class="seg" role="group" aria-label="Show fragrances for">
        <button data-g="both">Both</button><button data-g="men">Men</button><button data-g="women">Women</button>
      </div>
      <button class="theme" id="theme" aria-label="Switch light or dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="wrap">
  <section id="explore" class="view" hidden>
    <div class="hero">
      <h1><span style="--i:0">Smell</span> <span style="--i:1">expensive.</span><br><span style="--i:2"><em>Pay</em></span> <span style="--i:3"><em>honest.</em></span></h1>
      <p>Notes. Prices. Dupes. One place.</p>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="find">
      <label for="q" hidden>Search by name, brand or note</label>
      <input id="q" type="search" placeholder="Smells like…" autocomplete="off">
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="marquee" aria-label="Notes"><div id="marquee"></div></div>
    <div id="top"></div>
    <div class="sub"><h2 id="feedTitle">Explore</h2><button class="link" id="shuffle">Shuffle</button></div>
    <div class="grid" id="feed"></div>
    <div id="sentinel"></div>
    <div class="end" id="end" hidden><button class="btn" id="again">That's all. Shuffle again</button></div>
  </section>

  <section id="dupes" class="view narrow" hidden>
    <div class="head">
      <h2>Dupes</h2>
      <p>Type any fragrance. See what it dupes, or what dupes it.</p>
      <label for="dq" hidden>Search any fragrance</label>
      <input id="dq" type="search" placeholder="9PM, Aventus, Cloud…" autocomplete="off">
      <div class="count" id="dcount" aria-live="polite"></div>
    </div>
    <div id="dout"></div>
  </section>

  <section id="match" class="view" hidden>
    <div class="head narrow" style="margin:0">
      <h2>Match me</h2>
      <p>Tap what you like. Picks update live.</p>
      <div class="q"><h3>Love</h3><div class="chips" id="like"></div></div>
      <div class="q"><h3>Skip</h3><div class="chips" id="avoid"></div></div>
      <div class="q"><h3>Wear it</h3><div class="chips" id="when"></div></div>
    </div>
    <div class="sub"><h2>Your picks</h2><button class="link" id="reset">Reset</button></div>
    <div class="grid" id="picks"></div>
  </section>

  <section id="page" class="view" hidden></section>
</div>

<script type="module">
import { ACCORDS, accords as accordsOf, ink } from './accords.js';
import { norm, slug } from './shared.js';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const $ = id => document.getElementById(id);
const ext = 'target="_blank" rel="noopener"';
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let data, ratings = null, gender = store.get('gender') || 'both';

const QUIZ = ['Citrus', 'Fresh', 'Aquatic', 'Aromatic', 'Floral', 'Fruity', 'Sweet', 'Vanilla', 'Warm spicy', 'Amber', 'Woody', 'Musky', 'Leather', 'Smoky'];
const DAY = ['Citrus', 'Fresh', 'Aquatic', 'Aromatic', 'Floral', 'White floral', 'Fruity', 'Green', 'Fresh spicy'];
const NIGHT = ['Sweet', 'Vanilla', 'Warm spicy', 'Amber', 'Woody', 'Leather', 'Smoky', 'Oud', 'Coffee', 'Earthy'];
const GENDER = { men: 'For men', women: 'For women', unisex: 'Unisex' };

const notesOf = f => [...f.notes.top, ...f.notes.heart, ...f.notes.base];
const pool = () => data.fragrances.filter(f => gender === 'both' || f.gender === gender || f.gender === 'unisex');
const accCache = new Map();
const acc = f => accCache.get(f) || accCache.set(f, accordsOf(notesOf(f))).get(f);
const dots = f => `<div class="dots">${acc(f).slice(0, 3).map(a => `<span style="--c:${a.color}">${a.name}</span>`).join('')}</div>`;
const full = f => `${f.brand} ${f.name}`;
const href = f => `#f/${slug(f)}`;
const find = name => data.fragrances.find(f => slug(f) === norm(name));
// Dupes of a fragrance: entries that say they dupe it, plus names it lists.
const dupesOf = f => data.fragrances.filter(d => d.dupeOf && norm(d.dupeOf) === slug(f));
const originalOf = f => f.dupeOf ? find(f.dupeOf) : null;

const SHAPES = [
  'M16 38a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v64a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8z',
  'M40 36a36 36 0 1 1 0 72a36 36 0 1 1 0-72z',
  'M8 54a14 14 0 0 1 14-14h36a14 14 0 0 1 14 14v42a14 14 0 0 1-14 14H22a14 14 0 0 1-14-14z',
];
let gid = 0;
function art(f, cls = '', style = '') {
  const open = `<div class="art ${cls}" style="${style}">`;
  if (f.image) return `${open}<img src="${esc(f.image)}&width=${cls === 'big' ? 700 : 400}" alt="${esc(full(f))} bottle" loading="lazy"></div>`;
  const c = acc(f).slice(0, 3).map(a => a.color);
  if (!c.length) c.push('#d8d2c8');
  if (c.length < 2) c.push(c[0]);
  const shape = SHAPES[[...f.name].reduce((h, ch) => h + ch.charCodeAt(0), 0) % SHAPES.length];
  const id = 'g' + gid++;
  const stops = c.map((x, j) => `<stop offset="${j / (c.length - 1)}" stop-color="${x}"/>`).join('');
  return `${open}<svg viewBox="0 0 80 112" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".4" y2="1">${stops}</linearGradient></defs>
    <rect x="29" y="2" width="22" height="20" rx="4" fill="#3a3f46"/><rect x="34" y="21" width="12" height="12" fill="#3a3f46" opacity=".8"/>
    <path d="${shape}" fill="url(#${id})"/><path d="${shape}" fill="none" stroke="#000" stroke-opacity=".08"/>
    <rect x="22" y="48" width="5" height="34" rx="2.5" fill="#fff" opacity=".4"/></svg></div>`;
}

const chipQ = list => list.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');
const avg = f => { const r = ratings?.[slug(f)]; return r?.count ? r.sum / r.count : 0; };
function tile(f, i, extra = '') {
  const n = dupesOf(f).length;
  const r = ratings?.[slug(f)];
  return `<a class="tile" href="${href(f)}" style="--i:${i}">
    ${f.dupeOf ? '<span class="pill left">Dupe</span>' : ''}${n ? `<span class="pill">${plural(n, 'dupe')}</span>` : ''}
    ${art(f)}<div class="name">${esc(f.name)}</div><div class="brand">${esc(f.brand)}${r?.count ? ` · ★ ${avg(f).toFixed(1)}` : ''}</div>${dots(f)}${extra}</a>`;
}

/* ---------- Explore (with search) ---------- */
let feed = [], shown = 0;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const has = (q, fields) => fields.join(' ').toLowerCase().includes(q);
function resetFeed() {
  const q = $('q').value.trim().toLowerCase();
  feed = q ? pool().filter(f => has(q, [f.brand, f.name, ...notesOf(f), ...acc(f).map(a => a.name)])) : shuffle(pool());
  $('count').textContent = q ? plural(feed.length, 'match', 'matches') : '';
  $('feedTitle').textContent = q ? `Smells like ${$('q').value.trim()}` : 'Explore';
  $('shuffle').hidden = !!q;
  shown = 0;
  $('feed').innerHTML = feed.length ? '' : `<p class="none">Nothing yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a></p>`;
  moreFeed();
}
function moreFeed() {
  const next = feed.slice(shown, shown + 9);
  $('feed').insertAdjacentHTML('beforeend', next.map((f, i) => tile(f, i)).join(''));
  shown += next.length;
  $('end').hidden = shown < feed.length || !feed.length || !!$('q').value.trim();
}
function renderTop() {
  const top = pool().filter(f => ratings?.[slug(f)]?.count)
    .sort((a, b) => avg(b) - avg(a) || ratings[slug(b)].count - ratings[slug(a)].count).slice(0, 3);
  $('top').innerHTML = top.length ? `<div class="sub"><h2>Top rated</h2><small>Voted by visitors</small></div>
    <div class="grid">${top.map((f, i) => tile(f, i)).join('')}</div>` : '';
}
function renderExplore() {
  $('shelf').innerHTML = shuffle(pool().filter(f => f.image)).slice(0, 6).map((f, i) => art(f, '', `--i:${i}`)).join('');
  renderTop();
  resetFeed();
}

/* ---------- Dupes: what does it dupe, what dupes it ---------- */
function verdict(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const parts = [];
  if (f.dupeOf) parts.push(`Dupe of ${o ? `<a href="${href(o)}">${esc(full(o))}</a>` : esc(f.dupeOf)}.`);
  if (mine.length) parts.push(`Its dupes:<div class="chips">${mine.map(d => `<a class="chip" href="${href(d)}">${esc(full(d))} →</a>`).join('')}</div>`);
  if (!parts.length) parts.push('Not a dupe. No known dupes yet.');
  return parts.join(' ');
}
const box = f => `<article class="box">
    <a class="top" href="${href(f)}">${art(f, 'thumb')}<div><div class="label">${f.dupeOf ? 'Dupe' : 'Original'}</div><h3>${esc(f.name)}</h3><div class="brand">${esc(f.brand)}</div></div></a>
    <div class="verdict">${verdict(f)}</div></article>`;
function renderDupes() {
  const q = $('dq').value.trim().toLowerCase();
  const hits = q ? pool().filter(f => has(q, [f.brand, f.name, full(f)]))
    : pool().filter(f => dupesOf(f).length);
  $('dcount').textContent = q ? plural(hits.length, 'match', 'matches') : `${hits.length} originals with dupes`;
  $('dout').innerHTML = hits.map(box).join('')
    || `<p class="none" style="text-align:center;margin-top:32px">Not in our list yet. <a href="https://www.fragrantica.com/search/?query=${enc(q)}" ${ext}>Try Fragrantica ↗</a></p>`;
}

/* ---------- Match me ---------- */
const picked = id => [...$(id).querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.v);
function renderQuiz() {
  const chip = n => `<button class="chip dot" data-v="${n}" aria-pressed="false" style="--c:${ACCORDS.find(a => a.name === n).color}">${n}</button>`;
  $('like').innerHTML = QUIZ.map(chip).join('');
  $('avoid').innerHTML = QUIZ.map(chip).join('');
  $('when').innerHTML = ['Day', 'Night', 'Anytime'].map(v => `<button class="chip" data-v="${v}" data-single aria-pressed="false">${v}</button>`).join('');
}
function renderPicks() {
  const like = picked('like'), avoid = picked('avoid'), when = picked('when')[0];
  if (!like.length && !avoid.length && !when) return void ($('picks').innerHTML = '<p class="none">Tap a scent to start.</p>');
  const scored = pool().map(f => {
    let s = like.length ? 0 : 0.5; // no likes: anything not skipped counts
    const why = [];
    for (const a of acc(f).slice(0, 6)) {
      const w = a.pct / 100;
      if (like.includes(a.name)) { s += w * 2; why.push(a.name); }
      if (avoid.includes(a.name)) s -= w * 3;
      if ((when === 'Day' && DAY.includes(a.name)) || (when === 'Night' && NIGHT.includes(a.name))) s += w * 0.5;
    }
    return { f, s, why };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 6);
  $('picks').innerHTML = scored.map(({ f, why }, i) => tile(f, i,
    `<div class="why">${why.length ? why.join(' + ') : when === 'Day' || when === 'Night' ? 'Good for ' + when.toLowerCase() : 'Nothing you skip'}</div>`)).join('')
    || '<p class="none">No match. Skip less.</p>';
}

/* ---------- Fragrance page ---------- */
const accordBars = f => `<div class="accords">${acc(f).slice(0, 7).map((a, i) =>
  `<div class="acc"><div style="--w:${a.pct}%;--c:${a.color};--i:${i};color:${ink(a.color)}">${a.name.toLowerCase()}</div></div>`).join('')}</div>`;
const tier = (label, notes) => notes.length ? `<div><span>${label}</span><div class="chips">${notes.map(n =>
  `<button class="chip dot" data-q="${esc(n)}" style="--c:${accordsOf([n])[0]?.color || '#ccc'}">${esc(n)}</button>`).join('')}</div></div>` : '';
const sharesNotes = f => {
  const mine = new Set(notesOf(f).map(n => n.toLowerCase()));
  return data.fragrances.filter(g => g !== f)
    .map(g => [g, notesOf(g).filter(n => mine.has(n.toLowerCase())).length])
    .filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).map(([g]) => g);
};
function starsHtml(f) {
  if (!ratings) return '';
  const r = ratings[slug(f)], mine = Number(store.get('vote:' + slug(f))) || 0;
  const shown = Math.round(mine || (r?.count ? r.sum / r.count : 0));
  return `<h4>Rate it</h4><div class="stars" data-slug="${slug(f)}">${[1, 2, 3, 4, 5].map(n =>
    `<button data-star="${n}" class="${n <= shown ? 'on' : ''}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}
    <span>${r?.count ? `${(r.sum / r.count).toFixed(1)} · ${plural(r.count, 'vote')}` : 'No votes yet'}${mine ? ' · yours: ' + mine : ''}</span></div>`;
}
function fragPage(f) {
  const o = originalOf(f), mine = dupesOf(f);
  const listed = f.similar.map(s => find(s) || s);
  const similar = [...new Set([...listed.filter(x => typeof x !== 'string'), ...sharesNotes(f)])].filter(g => g !== o && !mine.includes(g)).slice(0, 6);
  const outside = listed.filter(x => typeof x === 'string');
  return `<button class="back link" data-back>← Back</button>
    <div class="page">
      ${art(f, 'big')}
      <div>
        <div class="brand">${esc(f.brand)}</div>
        <h1>${esc(f.name)}</h1>
        <div class="meta">${GENDER[f.gender] || ''}</div>
        ${o ? `<a class="dupeof" href="${href(o)}">Dupe of ${esc(full(o))} →</a>` : f.dupeOf ? `<span class="dupeof">Dupe of ${esc(f.dupeOf)}</span>` : ''}
        <h4>Main accords</h4>${accordBars(f)}
        <div id="stars">${starsHtml(f)}</div>
      </div>
    </div>
    <h4>Notes</h4><div class="pyr">${tier('Top', f.notes.top)}${tier('Heart', f.notes.heart)}${tier('Base', f.notes.base)}</div>
    <p class="fine">Notes compiled by hand from brand and store listings${f.source ? ` (<a href="${esc(f.source)}" ${ext}>source ↗</a>)` : ''}. Accords worked out from these notes. Spot a mistake? Check Fragrantica.</p>
    <h4>Buy</h4><ul class="rows" id="prices"><li><small>Checking prices…</small></li></ul>
    ${mine.length ? `<h4>Dupes</h4><div class="grid">${mine.map((d, i) => tile(d, i)).join('')}</div>` : ''}
    ${similar.length ? `<h4>Smells like…</h4><div class="grid">${similar.map((g, i) => tile(g, i)).join('')}</div>` : ''}
    ${outside.length ? `<h4>Also try</h4><div class="chips">${outside.map(s => `<a class="chip" href="https://www.fragrantica.com/search/?query=${enc(s)}" ${ext}>${esc(s)} ↗</a>`).join('')}</div>` : ''}
    <a class="more" href="https://www.fragrantica.com/search/?query=${enc(full(f))}" ${ext}>Fragrantica page ↗</a>`;
}

async function loadPrices(f) {
  const q = full(f);
  let live = [];
  try { // live prices need the /api/prices function (Cloudflare); without it, store links only
    const r = await fetch(`/api/prices?q=${enc(q)}&name=${enc(f.name)}&brand=${enc(f.brand)}`);
    if (r.ok && r.headers.get('content-type')?.includes('json')) live = (await r.json()).prices;
  } catch {}
  const el = $('prices');
  if (!el) return;
  const perMl = p => p.price / p.size;
  const best = live.length > 1 ? live.reduce((a, b) => perMl(b) < perMl(a) ? b : a) : null;
  const rows = live.sort((a, b) => perMl(a) - perMl(b)).map(p => `<li>
      <a href="${esc(p.url)}" ${ext}>${esc(p.store)}</a>${p === best ? '<span class="best">Best value</span>' : ''}
      <small>${p.size} ml · $${perMl(p).toFixed(2)}/ml</small><span class="r">$${p.price.toFixed(2)}</span></li>`);
  const priced = new Set(live.map(p => p.store));
  for (const [s, url] of Object.entries(data.stores)) {
    if (!priced.has(s)) rows.push(`<li><a href="${url}${enc(q)}" ${ext}>${esc(s)}</a><span class="r"><small>See price ↗</small></span></li>`);
  }
  el.innerHTML = rows.join('');
}

async function vote(slugId, stars) {
  try {
    const r = await fetch('/api/ratings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug: slugId, stars }) });
    if (!r.ok) return;
    const t = await r.json();
    ratings[slugId] = { sum: t.sum, count: t.count };
    store.set('vote:' + slugId, stars);
    $('stars').innerHTML = starsHtml(data.fragrances.find(f => slug(f) === slugId));
    renderTop();
  } catch {}
}

/* ---------- Shell ---------- */
function setGender(g) {
  gender = g;
  store.set('gender', g);
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.g === g);
  renderExplore(); renderDupes(); renderPicks();
}
function route() {
  const [tab, id] = location.hash.slice(1).split('/');
  let view = ['explore', 'dupes', 'match'].includes(tab) ? tab : 'explore';
  const f = tab === 'f' && data.fragrances.find(x => slug(x) === id);
  if (f) {
    view = 'page';
    $('page').innerHTML = fragPage(f);
    document.title = `${full(f)} · Fragrance Unlocked`;
    loadPrices(f);
  } else document.title = 'Fragrance Unlocked';
  for (const s of document.querySelectorAll('section.view')) s.hidden = s.id !== view;
  for (const a of document.querySelectorAll('.tabs a')) {
    if (a.hash === '#' + view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('.seg button');
  if (g) return setGender(g.dataset.g);
  const star = t.closest('[data-star]');
  if (star) return vote(star.closest('.stars').dataset.slug, Number(star.dataset.star));
  const opt = t.closest('.q .chip');
  if (opt) {
    const on = opt.getAttribute('aria-pressed') !== 'true';
    if (opt.hasAttribute('data-single')) opt.parentNode.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
    opt.setAttribute('aria-pressed', on);
    const other = opt.closest('#like') ? 'avoid' : opt.closest('#avoid') ? 'like' : null; // can't love and skip the same scent
    if (on && other) $(other).querySelector(`[data-v="${opt.dataset.v}"]`).setAttribute('aria-pressed', 'false');
    return renderPicks();
  }
  if (t.closest('[data-back]')) return history.length > 1 ? history.back() : (location.hash = 'explore');
  const q = t.closest('[data-q]')?.dataset.q;
  if (q) { $('q').value = q; location.hash = 'explore'; resetFeed(); setTimeout(() => $('feedTitle').scrollIntoView({ behavior: 'smooth' }), 50); }
});
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('theme', dark ? 'light' : 'dark');
};
$('shuffle').onclick = $('again').onclick = () => resetFeed();
$('reset').onclick = () => { renderQuiz(); renderPicks(); };

[data, ratings] = await Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('/api/ratings').then(r => r.ok && r.headers.get('content-type')?.includes('json') ? r.json() : null).catch(() => null), // null: ratings off
]);
const notes = [...new Set(data.fragrances.flatMap(notesOf))].slice(0, 36);
$('marquee').innerHTML = chipQ([...notes, ...notes]);
renderQuiz();
$('q').addEventListener('input', resetFeed);
$('dq').addEventListener('input', renderDupes);
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < feed.length) moreFeed(); }, { rootMargin: '400px' }).observe($('sentinel'));
setGender(['both', 'men', 'women'].includes(gender) ? gender : 'both');
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
